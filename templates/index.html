<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA-ASSIST | NovaMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .brand h2 {
            margin: 0;
            font-size: 18px;
        }

        .brand span {
            font-size: 12px;
            color: #6b7280;
        }

        .status {
            font-size: 13px;
            color: #16a34a;
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            overflow: hidden;
        }

        .chat-container {
            width: 850px;
            max-width: 100%;
            height: 100%;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .welcome {
            padding: 24px;
            border-bottom: 1px solid #eee;
        }

        .welcome h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        #messages {
            flex: 1;
            padding: 22px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .assistant .bubble {
            background: #f3f4f6;
        }

        .user .bubble {
            background: #111827;
            color: white;
        }

        .typing {
            color: #6b7280;
            font-style: italic;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 13px;
            outline: none;
            font-size: 14px;
        }

        #messageInput:focus {
            border-color: #111827;
        }

        button {
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            padding: 0 22px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #374151;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 0 22px 15px;
            flex-wrap: wrap;
        }

        .quick {
            border: 1px solid #e5e7eb;
            background: white;
            color: #374151;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .quick:hover {
            background: #f3f4f6;
        }

        @media (max-width: 600px) {

            header {
                padding: 0 15px;
            }

            .main {
                padding: 10px;
            }

            .chat-container {
                border-radius: 12px;
            }

            .bubble {
                max-width: 85%;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="brand">

            <div class="logo">
                N
            </div>

            <div>
                <h2>NOVA-ASSIST</h2>
                <span>NovaMart Customer Support</span>
            </div>

        </div>

        <div class="status">
            ● AI Support Online
        </div>

    </header>


    <main class="main">

        <div class="chat-container">

            <div class="welcome">

                <h1>How can we help?</h1>

                <p>
                    Ask about your orders, products, returns, or anything related to NovaMart.
                </p>

            </div>


            <div id="messages">

                <div class="message assistant">

                    <div class="bubble">
                        Hi! 👋 I'm NOVA-ASSIST. How can I help you today?
                    </div>

                </div>

            </div>


            <div class="quick-actions">

                <button class="quick"
                    onclick="quickMessage('Show me available laptops')">
                    💻 Products
                </button>

                <button class="quick"
                    onclick="quickMessage('Where is my order?')">
                    📦 Order status
                </button>

                <button class="quick"
                    onclick="quickMessage('I want to return my order')">
                    ↩️ Return
                </button>

            </div>


            <div class="input-area">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button id="sendButton" onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>


<script>

let conversationId = null;

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const messages =
    document.getElementById("messages");


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});


function addMessage(text, role) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    messages.scrollTop =
        messages.scrollHeight;
}


function showTyping() {

    const wrapper =
        document.createElement("div");

    wrapper.id = "typing";

    wrapper.className =
        "message assistant";

    wrapper.innerHTML = `
        <div class="bubble typing">
            NOVA-ASSIST is thinking...
        </div>
    `;

    messages.appendChild(wrapper);

    messages.scrollTop =
        messages.scrollHeight;
}


function removeTyping() {

    const typing =
        document.getElementById("typing");

    if (typing) {
        typing.remove();
    }
}


async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    sendButton.disabled = true;

    showTyping();

    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text,
                    conversation_id: conversationId
                })

            });


        const data =
            await response.json();

        removeTyping();


        if (!response.ok) {

            addMessage(
                data.error || "Something went wrong.",
                "assistant"
            );

            return;
        }


        conversationId =
            data.conversation_id;

        addMessage(
            data.response,
            "assistant"
        );

    }

    catch (error) {

        removeTyping();

        addMessage(
            "Unable to connect to NOVA-ASSIST.",
            "assistant"
        );

    }

    finally {

        sendButton.disabled = false;

        input.focus();

    }
}


function quickMessage(text) {

    input.value = text;

    sendMessage();

}


input.focus();

</script>

</body>
</html>
